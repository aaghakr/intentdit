# Default settings
defaults:
  device: "cuda"  # or "cpu"
  batch_size: 1
  image_size: 512
  num_classes:
    pku: 4
    cgl: 5
  
# Fallback behavior
fallback:
  use_latest_checkpoint: true  # If specific checkpoint not found, use latest
  create_dummy_output: true    # If no checkpoint found, create dummy output
  log_missing_checkpoints: true  # Log when checkpoints are missing
